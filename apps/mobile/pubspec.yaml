name: free_matrimony
description: Free Matrimony member app for iOS and Android.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  http: ^1.4.0
  flutter_secure_storage: ^11.2.0
  material_ui: ^1.11.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf

# App icon: `dart run flutter_launcher_icons` regenerates the iOS and Android icons from these files.
flutter_launcher_icons:
  image_path: assets/icon/app-icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#B01743"
  adaptive_icon_foreground: assets/icon/app-icon-foreground.png
